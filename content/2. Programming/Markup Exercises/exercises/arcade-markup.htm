<script type="text/plain" data-file="Main.java">
public class Main {
    public static void main(String[] args) {
        Arcade arcade = new Arcade();
        int myTokens = 20;
        boolean isMember = true;
        double cardPrice = 5.50;

        myTokens = arcade.playGames(myTokens, 4);
        String prize = arcade.getPrize(myTokens * 25);

        if (isMember && myTokens > 0) {
            cardPrice = cardPrice / 2;
        }
        arcade.printReceipt("Jordan", cardPrice);
    }
}
</script>

<script type="text/plain" data-file="Arcade.java">
public class Arcade {

    // Each game costs 3 tokens
    public int playGames(int tokens, int games) {
        int cost = 3;
        for (int i = 0; i < games; i++) {
            tokens = tokens - cost;
        }
        return tokens;
    }

    public String getPrize(int tickets) {
        if (tickets >= 500) {
            return "Giant Panda";
        } else if (tickets >= 100) {
            return "Yo-yo";
        } else {
            return "Sticker";
        }
    }

    public void printReceipt(String name, double price) {
        System.out.println(name + " paid $" + price);
    }
}
</script>
